[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "defiant-fleetops"
version = "0.1.0"
description = "Defiant FleetOps repository and database enforcement foundation"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.116.1",
  "pydantic==2.11.7",
  "SQLAlchemy==2.0.43",
  "alembic==1.16.5",
  "psycopg[binary]==3.2.10",
  "argon2-cffi==25.1.0",
  "uuid6==2025.0.1",
  "tzdata==2026.3",
  "uvicorn==0.52.4",
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "httpx==0.28.1"]
dev = ["ruff==0.12.11"]

[tool.hatch.build.targets.wheel]
packages = ["server/fleetops"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
addopts = "-ra --strict-config --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["server"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
